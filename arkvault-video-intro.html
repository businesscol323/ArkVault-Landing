<!-- PASTE THIS RIGHT AFTER YOUR OPENING <body> TAG -->

<div id="intro-overlay" style="
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 99999;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 1.2s ease;
">
  <video
    id="intro-video"
    autoplay
    muted
    playsinline
    style="
      width: 100%;
      height: 100%;
      object-fit: cover;
    "
  >
    <source src="intro.mp4" type="video/mp4">
  </video>
</div>

<script>
  (function() {
    const overlay = document.getElementById('intro-overlay');
    const video = document.getElementById('intro-video');

    // Fade out after video ends or after 7 seconds max
    function fadeOut() {
      overlay.style.opacity = '0';
      setTimeout(function() {
        overlay.style.display = 'none';
        document.body.style.overflow = '';
      }, 1200);
    }

    // Hide scrollbar during intro
    document.body.style.overflow = 'hidden';

    // Fade when video ends
    video.addEventListener('ended', fadeOut);

    // Failsafe — fade after 7 seconds no matter what
    setTimeout(fadeOut, 7000);

    // If video fails to load, fade immediately
    video.addEventListener('error', function() {
      overlay.style.display = 'none';
      document.body.style.overflow = '';
    });
  })();
</script>

<!-- END VIDEO INTRO -->
